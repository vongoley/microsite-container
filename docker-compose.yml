services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./data:/app/app/data
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # Generate with: python3 -c "import hashlib; print(hashlib.sha256(b'your-password').hexdigest())"
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - API_KEY=${API_KEY}
      - MICROSITE_DATA_DIR=${MICROSITE_DATA_DIR:-/app/app/data/microsites}
      - MICROSITE_MAX_FILES=${MICROSITE_MAX_FILES:-100000}
      - MICROSITE_MAX_TOTAL_BYTES=${MICROSITE_MAX_TOTAL_BYTES:-53687091200}
      - MICROSITE_MAX_BLOB_BYTES=${MICROSITE_MAX_BLOB_BYTES:-5368709120}
      - MICROSITE_RUNTIME_MAX_DOCUMENT_BYTES=${MICROSITE_RUNTIME_MAX_DOCUMENT_BYTES:-1048576}
      - MICROSITE_RUNTIME_MAX_VERSIONS=${MICROSITE_RUNTIME_MAX_VERSIONS:-100}
      - MICROSITE_PUBLIC_BASE_URL=${MICROSITE_PUBLIC_BASE_URL:-}
      - MICROSITE_ACCEL_PREFIX=${MICROSITE_ACCEL_PREFIX:-}
      - MICROSITE_CORS_ORIGIN=${MICROSITE_CORS_ORIGIN:-*}
