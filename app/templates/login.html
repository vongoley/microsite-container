<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; color: #222; }
    label { display: block; font-size: .875rem; color: #555; margin-bottom: .25rem; }
    input {
      width: 100%;
      padding: .625rem .75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: .9375rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #4f46e5; }
    .field { margin-bottom: 1rem; }
    .error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      border-radius: 6px;
      padding: .5rem .75rem;
      font-size: .875rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: .7rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: .9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <h1>HTML Container</h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">登录</button>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.85rem;">
      <a href="#" onclick="document.getElementById('invite-section').style.display='block';this.parentElement.style.display='none';" style="color:#4f46e5;text-decoration:none;">使用邀请码注册</a>
    </p>
    <div id="invite-section" style="display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid #e5e7eb;">
      <form method="get" action="/admin/register/code" onsubmit="this.action='/admin/register/'+document.getElementById('invite-code').value;return true;">
        <div class="field">
          <label for="invite-code">邀请码</label>
          <input id="invite-code" type="text" placeholder="粘贴邀请码" required>
        </div>
        <button type="submit" style="background:#059669;">前往注册</button>
      </form>
    </div>
  </div>
</body>
</html>
