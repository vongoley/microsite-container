<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 — Microsite Container</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: .5rem; text-align: center; color: #222; }
    .subtitle { text-align: center; font-size: .85rem; color: #6b7280; margin-bottom: 1.5rem; }
    .role-badge {
      display: inline-block;
      font-size: .75rem;
      padding: .15rem .5rem;
      border-radius: 4px;
      font-weight: 500;
      background: #dbeafe;
      color: #1e40af;
    }
    label { display: block; font-size: .875rem; color: #555; margin-bottom: .25rem; }
    input {
      width: 100%;
      padding: .625rem .75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: .9375rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #4f46e5; }
    .field { margin-bottom: 1rem; }
    .error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      border-radius: 6px;
      padding: .5rem .75rem;
      font-size: .875rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: .7rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: .9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #4338ca; }
    .login-link { text-align: center; margin-top: 1rem; font-size: .85rem; }
    .login-link a { color: #4f46e5; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>注册账号</h1>
    <p class="subtitle">你将注册为 <span class="role-badge">{{ '超级管理员' if role == 'super_admin' else '普通管理员' }}</span></p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/register/{{ code }}">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" required minlength="2">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
      </div>
      <div class="field">
        <label for="password_confirm">确认密码</label>
        <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit">注册</button>
    </form>
    <p class="login-link">已有账号？<a href="/admin/login">去登录</a></p>
  </div>
</body>
</html>
