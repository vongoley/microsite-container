<!DOCTYPE html>
<html data-theme="dark" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — 需要密码</title>
  <style>
    [data-theme="dark"] {
      --bg: #1a1a2e; --surface: #242444; --text: #e0e0e0; --muted: #9a9ab0;
      --border: #3a3a5a; --accent: #6c63ff; --err-bg: #3a1a1a; --err: #ff8a8a;
    }
    [data-theme="light"] {
      --bg: #f5f5f7; --surface: #ffffff; --text: #1a1a1a; --muted: #6b7280;
      --border: #e5e7eb; --accent: #4f46e5; --err-bg: #fef2f2; --err: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 32px 24px; width: 100%; max-width: 380px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .lock-icon { font-size: 2.5rem; text-align: center; margin-bottom: 1rem; }
    h1 {
      font-size: clamp(1.1rem, 1rem + 1vw, 1.3rem); font-weight: 600;
      text-align: center; margin-bottom: .5rem; word-break: break-all;
    }
    .subtitle { text-align: center; font-size: .875rem; color: var(--muted); margin-bottom: 1.5rem; }
    .err { background: var(--err-bg); color: var(--err); border-radius: 8px; padding: .6rem .8rem; font-size: .85rem; margin-bottom: 1rem; text-align: center; }
    input {
      width: 100%; padding: .75rem .9rem; min-height: 44px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 1rem; outline: none; background: var(--bg); color: var(--text);
      margin-bottom: 1rem;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; padding: .8rem; min-height: 44px;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 500; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .theme-toggle {
      position: fixed; top: 16px; right: 16px;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
  <div class="card">
    <div class="lock-icon">🔒</div>
    <h1>{{ title }}</h1>
    <p class="subtitle">此页面受密码保护，请输入访问密码</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/unlock/{{ page_id }}">
      <input type="password" name="password" required autofocus autocomplete="off" placeholder="访问密码">
      <button type="submit">进入</button>
    </form>
  </div>
  <script>
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      document.getElementById('theme-btn').textContent = t === 'dark' ? '🌙' : '☀️';
    }
    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }
    const saved = localStorage.getItem('theme');
    if (saved) applyTheme(saved);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) applyTheme('light');
  </script>
</body>
</html>
