<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Container — 管理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9fafb;
      color: #111;
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: .875rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; color: #4f46e5; }
    header a { font-size: .875rem; color: #6b7280; text-decoration: none; }
    header a:hover { color: #111; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

    /* Upload card */
    .upload-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .upload-card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
    .upload-row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
    .upload-row input[type=text] {
      flex: 1 1 200px;
      padding: .5rem .75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: .9rem;
      outline: none;
    }
    .upload-row input[type=text]:focus { border-color: #4f46e5; }
    .file-label {
      display: inline-block;
      padding: .5rem .875rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: .875rem;
      cursor: pointer;
      background: #f9fafb;
      white-space: nowrap;
    }
    .file-label:hover { background: #f3f4f6; }
    #file-name { font-size: .8rem; color: #6b7280; align-self: center; }
    input[type=file] { display: none; }
    .btn-upload {
      padding: .5rem 1.25rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-upload:hover { background: #4338ca; }

    /* Table */
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e5e7eb; }
    th {
      text-align: left;
      font-size: .8rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: .75rem 1rem;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }
    td { padding: .75rem 1rem; font-size: .9rem; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .badge {
      display: inline-block;
      font-family: monospace;
      font-size: .8rem;
      background: #ede9fe;
      color: #6d28d9;
      padding: .1rem .45rem;
      border-radius: 4px;
    }
    .link-cell { display: flex; align-items: center; gap: .5rem; }
    .copy-btn {
      padding: .2rem .5rem;
      font-size: .75rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      color: #374151;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #f3f4f6; }
    .copy-btn.copied { background: #d1fae5; border-color: #6ee7b7; color: #065f46; }
    .delete-form button {
      padding: .25rem .6rem;
      font-size: .8rem;
      background: #fff;
      border: 1px solid #fca5a5;
      color: #dc2626;
      border-radius: 4px;
      cursor: pointer;
    }
    .delete-form button:hover { background: #fef2f2; }
    .empty { text-align: center; color: #9ca3af; padding: 3rem 1rem; font-size: .9rem; }
    .ts { color: #9ca3af; font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>HTML Container</h1>
    <a href="/admin/logout">退出登录</a>
  </header>
  <main>
    <div class="upload-card">
      <h2>上传 HTML</h2>
      <form method="post" action="/admin/upload" enctype="multipart/form-data">
        <div class="upload-row">
          <input type="text" name="title" placeholder="标题（用于列表展示）" required>
          <label class="file-label" for="file-input">选择文件</label>
          <input id="file-input" type="file" name="file" accept=".html" required>
          <span id="file-name">未选择文件</span>
          <button type="submit" class="btn-upload">上传</button>
        </div>
      </form>
    </div>

    {% if pages %}
    <table>
      <thead>
        <tr>
          <th>标题</th>
          <th>ID</th>
          <th>分享链接</th>
          <th>上传时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        {% for p in pages %}
        <tr>
          <td>{{ p.title }}</td>
          <td><span class="badge">{{ p.id }}</span></td>
          <td>
            <div class="link-cell">
              <a href="/view/{{ p.id }}" target="_blank" style="font-size:.85rem;color:#4f46e5;word-break:break-all;">/view/{{ p.id }}</a>
              <button class="copy-btn" onclick="copyLink(this, '/view/{{ p.id }}')">复制</button>
            </div>
          </td>
          <td class="ts">{{ p.uploaded_at[:16].replace("T"," ") }}</td>
          <td>
            <form class="delete-form" method="post" action="/admin/delete/{{ p.id }}"
                  onsubmit="return confirm('确认删除「{{ p.title }}」？')">
              <button type="submit">删除</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <div class="empty">暂无已上传的 HTML，请先上传。</div>
    {% endif %}
  </main>

  <script>
    document.getElementById("file-input").addEventListener("change", function() {
      document.getElementById("file-name").textContent = this.files[0]?.name || "未选择文件";
    });

    function copyLink(btn, path) {
      const url = location.origin + path;
      navigator.clipboard.writeText(url).then(() => {
        btn.textContent = "已复制";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("copied"); }, 1500);
      });
    }
  </script>
</body>
</html>
